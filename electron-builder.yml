appId: com.averagecanadianty.act-build-controller
productName: ACT Build Controller
copyright: Copyright © 2026 Average Canadian Ty

directories:
  buildResources: build

files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'

asarUnpack:
  - resources/**

win:
  executableName: ACTBuildController
  icon: build/icon.ico
  signAndEditExecutable: false

nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always

mac:
  icon: build/icon.icns
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false

dmg:
  artifactName: ${productName}-${version}.${ext}

linux:
  icon: build/icon.png
  target:
    - AppImage
    - deb
  maintainer: Average Canadian Ty
  category: Utility
  desktop:
    entry:
      Name: ACT Build Controller
      Comment: Matrix Orchestration System

appImage:
  artifactName: ${productName}-${version}.${ext}

npmRebuild: false

publish:
  provider: github
  releaseType: release