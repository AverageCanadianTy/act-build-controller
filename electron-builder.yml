appId: com.averagecanadianty.act-build-controller
productName: ACT Build Controller
copyright: Copyright © 2026 Average Canadian Ty

directories:
  buildResources: build
  output: dist/installers

files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'

asarUnpack:
  - resources/**

win:
  executableName: ACTBuildController
  icon: build/icon.ico
  # Required for building on Ubuntu 24.04 due to wine32 limitations
  signAndEditExecutable: false
  target:
    - target: nsis
      arch: x64

nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  icon: build/icon.png
  category: Utility
  maintainer: Average Canadian Ty
  target:
    - target: AppImage
      arch: x64
    - target: deb
      arch: [x64, arm64] # Generates both amd64 and arm64 versions
  desktop:
    entry:
      Name: ACT Build Controller
      Comment: Matrix Orchestration

deb:
  priority: optional
  # Ensures the architecture is clearly labeled in the filename
  artifactName: ${productName}-${version}-${arch}.${ext}
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  artifactName: ${productName}-${version}-${arch}.dmg
